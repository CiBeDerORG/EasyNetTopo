name: Real EasyHostAgent Cross-Repository Integration

on:
  push:
    paths:
      - 'internal/hosts/**'
      - 'internal/storage/**'
      - '.github/workflows/real-agent-integration.yml'
  pull_request:
    paths:
      - 'internal/hosts/**'
      - 'internal/storage/**'
      - '.github/workflows/real-agent-integration.yml'

permissions:
  contents: read

jobs:
  real-agent:
    name: 真实 Agent HTTPS + HTTP 配对与错误码一致性
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout EasyNetTopo
        uses: actions/checkout@v4
      - name: Checkout reviewed EasyHostAgent protocol revision
        uses: actions/checkout@v4
        with:
          repository: CiBeDerORG/EasyHostAgent
          ref: 87d7f9e387435a7ba0301af4b4f1d9de2b270feb
          path: integration-agent
          persist-credentials: false
      - name: Install Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build real Agent from fixed reviewed revision
        working-directory: integration-agent
        run: |
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/easyhostagent-integration" ./cmd/easyhostagent
      - name: 验证真实 Agent HTTPS/HTTP 身份、一次性配对和授权接口
        env:
          EASYNETTOPO_TEST_AGENT_BINARY: ${{ runner.temp }}/easyhostagent-integration
        run: go test -race -count=1 -timeout=90s -v -run '^TestRealAgent(Interop|HTTPInterop)$' ./internal/hosts
