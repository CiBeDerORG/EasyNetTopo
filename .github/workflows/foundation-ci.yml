name: EasyNetTopo Foundation CI

on:
  push:
    paths:
      - 'go.mod'
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - '.github/workflows/foundation-ci.yml'
  pull_request:
    paths:
      - 'go.mod'
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - '.github/workflows/foundation-ci.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generate module lock and format for bootstrap verification
        run: |
          go mod tidy
          gofmt -w cmd internal
      - name: Vet and test
        run: |
          go vet ./...
          go test -race ./...
      - name: Print generated Go sources and checksum for review branch
        if: success()
        run: |
          python3 - <<\'PY\'
          import json
          from pathlib import Path
          paths = [Path("go.mod"), Path("go.sum"), *sorted(Path("cmd").rglob("*.go")), *sorted(Path("internal").rglob("*.go"))]
          for p in paths:
              print("ENT_EXPORT_JSON=" + json.dumps({"path": str(p), "content": p.read_text(encoding="utf-8")}, ensure_ascii=True))
          PY
      - name: Compile Linux AMD64 and ARM64
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o bin/easynettopo-linux-amd64 ./cmd/easynettopo
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o bin/easynettopo-linux-arm64 ./cmd/easynettopo

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (bootstrap stage)
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Print npm lockfile for review branch
        if: success()
        run: |
          python3 - <<\'PY\'
          import json
          from pathlib import Path
          p = Path("package-lock.json")
          print("ENT_EXPORT_JSON=" + json.dumps({"path": "web/package-lock.json", "content": p.read_text(encoding="utf-8")}, ensure_ascii=True))
          PY
