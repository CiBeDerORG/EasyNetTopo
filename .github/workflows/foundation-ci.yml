name: EasyNetTopo Foundation CI

on:
  push:
    paths:
      - 'go.mod'
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - '.github/workflows/foundation-ci.yml'
  pull_request:
    paths:
      - 'go.mod'
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - '.github/workflows/foundation-ci.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify Go dependency lock
        run: |
          go mod tidy
          git diff -- go.mod go.sum
          git diff --exit-code -- go.mod go.sum
      - name: Format Go sources for migration review
        run: |
          gofmt -w internal/httpapi/device_routes.go internal/httpapi/device_routes_test.go internal/httpapi/server.go internal/storage/devices.go internal/storage/devices_test.go
      - name: Upload formatted Go sources
        uses: actions/upload-artifact@v4
        with:
          name: device-management-gofmt
          path: |
            internal/httpapi/device_routes.go
            internal/httpapi/device_routes_test.go
            internal/httpapi/server.go
            internal/storage/devices.go
            internal/storage/devices_test.go
      - name: Check gofmt
        run: |
          gofmt -l cmd internal | tee /tmp/unformatted-go-files
          test ! -s /tmp/unformatted-go-files
      - name: Vet and test
        run: |
          go vet ./...
          go test -race ./...
      - name: Compile Linux AMD64 and ARM64
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o bin/easynettopo-linux-amd64 ./cmd/easynettopo
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o bin/easynettopo-linux-arm64 ./cmd/easynettopo

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Frontend API error and install form regression tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
