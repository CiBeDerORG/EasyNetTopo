name: Sync Cesium frontend dependency lock

on:
  push:
    branches: [main]
    paths:
      - web/package.json

permissions:
  contents: write

concurrency:
  group: easynettopo-npm-lock-main
  cancel-in-progress: false

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm lockfile from package manifest
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit updated dependency lockfile
        run: |
          if git diff --quiet -- web/package-lock.json; then
            echo '锁文件已同步'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/package-lock.json
          git commit -m 'build: 同步 Cesium 前端依赖锁文件'
          git push origin HEAD:main
