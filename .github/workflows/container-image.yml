name: EasyNetTopo Multi-Arch Container Image

on:
  push:
    branches:
      - feat/deploy-manifest-lifecycle
      - feat/macos-app-market-20261106
    paths:
      - Dockerfile
      - .dockerignore
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - web/**
      - .github/workflows/container-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: easynettopo-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    if: github.ref == 'refs/heads/feat/deploy-manifest-lifecycle' || github.ref == 'refs/heads/feat/macos-app-market-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@v4
      - name: Enable ARM64 builder
        uses: docker/setup-qemu-action@v3
      - name: Configure multi-platform Buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish fixed SHA image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          tags: |
            ghcr.io/cibederorg/easynettopo:${{ github.ref == 'refs/heads/feat/deploy-manifest-lifecycle' && 'feat-deploy-manifest-lifecycle' || 'feat-macos-app-market-20261106' }}
            ghcr.io/cibederorg/easynettopo:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/CiBeDerORG/EasyNetTopo
            org.opencontainers.image.revision=${{ github.sha }}
